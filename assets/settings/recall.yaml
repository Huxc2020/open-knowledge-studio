recall:
  floor: 0.7
  topn: 3
  minlen: 6
  cooldown: 10
posttool:
  floor: 0.9
  topn: 2
  mode: signal
  recall: 1
  signal_rel_floor: 2.5
userprompt:
  floor: 0.7
  topn: 3
  cooldown: 10
conflict:
  window: 300
search_backend: fts5  # v0.6.0: 默认 fts5 node-level (吸收 TreeSearch, P@3=96%)
mail_topn: 3

# v0.6.0: Token Budget 分层注入（CV from karpathy-wiki L0-L3）
# recall 注入按预算截断，避免长 wiki 淹没上下文
inject:
  budget_chars: 4000      # 总注入预算（字符），约 1K token
  per_page_chars: 200     # 每页 body_preview 上限（L2 摘要级）
  title_only_floor: 0.5  # rel < 此值的只给 L0 标题行（不进 body）
